<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>София, с днём рождения! 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Nunito:wght@600;800&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{
  --bg1:#ffe4ee; --bg2:#ffd0e3; --env:#ffb3cf; --env-front:#ff9ec1; --flap:#ff8fb8;
  --card:#fffafc; --ink:#b0215a; --soft:#d96a99; --qr:#c2185b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#3a1626; --bg2:#2a0f1c; --env:#d9779f; --env-front:#c8658d; --flap:#bd5c84;
    --card:#fff1f6; --ink:#a01c50; --soft:#c25583; --qr:#a01c50;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(circle at 30% 20%,var(--bg1),var(--bg2));
  font-family:'Nunito',system-ui,sans-serif; color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  overflow:hidden; padding:0 16px 48px;
}
h1{font-family:'Nunito',system-ui,sans-serif;font-weight:800;font-size:1.7rem;margin:0 0 6px;text-align:center}
.hint{font-weight:800;color:var(--soft);margin:0 0 28px;text-align:center;transition:opacity .4s}
.scene{position:relative;width:320px;height:210px;margin-top:300px;perspective:900px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;animation:bob 3s ease-in-out infinite}
.scene.open{animation:none;cursor:default}
@keyframes bob{50%{transform:translateY(-6px)}}
.back,.pocket,.flap,.card{position:absolute}
.back{inset:0;background:var(--env);border-radius:10px;z-index:1;box-shadow:0 14px 30px rgba(176,33,90,.25)}
.pocket{inset:0;background:var(--env-front);z-index:3;border-radius:10px;
  clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.flap{left:0;top:0;width:100%;height:112px;background:var(--flap);z-index:4;
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;
  transition:transform .6s ease, z-index 0s .3s}
.seal{position:absolute;left:50%;top:52px;transform:translateX(-50%);font-size:1.7rem;z-index:5;transition:opacity .3s}
.open .flap{transform:rotateX(180deg);z-index:1}
.open .seal{opacity:0}
.card{left:35px;bottom:10px;width:250px;height:300px;background:var(--card);border-radius:16px;z-index:2;
  padding:18px 16px;text-align:center;box-shadow:0 6px 18px rgba(176,33,90,.2);
  border:3px dashed #ffb3cf;transform-origin:bottom center;transform:translateY(0) scale(.6);
  transition:transform 1.2s cubic-bezier(.2,.9,.3,1.1) .6s}
.open .card{transform:translateY(-175px) scale(1)}
.card h2{font-family:'Marck Script','Segoe Script',cursive;font-weight:400;font-size:1.7rem;margin:0 0 2px}
.card p{margin:0 0 10px;font-size:.85rem;color:var(--soft);font-weight:800}
#qr{display:inline-block;padding:10px;background:#fff;border-radius:12px;line-height:0;box-shadow:0 0 0 2px #ffd0e3}
#qr img,#qr canvas{max-width:100%}
.fallback{font-size:.8rem;line-height:1.3;padding:20px}
.heart{position:fixed;bottom:-30px;pointer-events:none;animation:rise 4s ease-in forwards;z-index:10}
@keyframes rise{to{transform:translateY(-110vh) rotate(30deg);opacity:0}}
@media (max-width:360px){.scene{transform:scale(.88)}}
</style>
</head>
<body>
  <h1>София, с днём рождения!!! 💗</h1>
  <p class="hint" id="hint">Нажми на конверт ✨</p>

  <div class="scene" id="scene" role="button" tabindex="0" aria-label="Открыть конверт">
    <div class="back"></div>
    <div class="card">
      <h2>Для тебя, София 🎀</h2>
      <p>Наведи камеру на код 🎀</p>
      <div id="qr"></div>
    </div>
    <div class="pocket"></div>
    <div class="flap"></div>
    <div class="seal">💌</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    // ВСТАВЬ СЮДА ССЫЛКУ НА СЕРТИФИКАТ
    const CERT_URL = "https://example.com/certificate";

    const qrBox = document.getElementById('qr');
    try {
      new QRCode(qrBox, {text: CERT_URL, width: 170, height: 170,
        colorDark: "#c2185b", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H});
    } catch (e) {
      qrBox.innerHTML = '<div class="fallback">QR не загрузился 🙈</div>';
    }

    const scene = document.getElementById('scene');
    function openEnvelope(){
      if (scene.classList.contains('open')) return;
      scene.classList.add('open');
      document.getElementById('hint').style.opacity = 0;
      setTimeout(hearts, 500);
    }
    function hearts(){
      const set = ['💗','💖','🌸','✨','🎀','💕'];
      for (let i = 0; i < 24; i++){
        const h = document.createElement('div');
        h.className = 'heart';
        h.textContent = set[i % set.length];
        h.style.left = Math.random()*100 + 'vw';
        h.style.fontSize = (16 + Math.random()*22) + 'px';
        h.style.animationDelay = (Math.random()*1.5) + 's';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 6000);
      }
    }
    scene.addEventListener('click', openEnvelope);
    scene.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openEnvelope(); });
  </script>
</body>
</html>
